[package]
name = "proofpay_escrow"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Non-custodial milestone escrow contract for NEAR"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.17.2", features = ["legacy"] }

[dev-dependencies]
near-sdk = { version = "5.17.2", features = ["legacy", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
strip = true
